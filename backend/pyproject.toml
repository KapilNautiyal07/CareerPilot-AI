[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "CareerPilot AI - multi-agent career intelligence API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.5,<0.6",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langchain-core>=1.6,<2",
    "anthropic>=2.1,<3",
    "google-genai>=2.32.0,<3",
    "pypdf>=6.0,<7",
    "python-docx>=1.2,<2",
    "bcrypt>=5.0,<6",
    "pyjwt>=2.15,<3",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.17,<1",
    "reportlab>=5.1,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"migrations/*" = ["E501"]
