# Render Blueprint for the CareerPilot API (FastAPI). Frontend: Vercel. Database: Neon.
# Render -> New -> Blueprint -> select this repo. Values marked `sync: false` are asked for once
# in the dashboard and never stored in git.
services:
  - type: web
    name: careerpilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free                      # free instances sleep when idle; "starter" keeps it awake
    region: singapore               # closest Render region to India
    healthCheckPath: /api/health
    numInstances: 1                 # workflows and rate limits run in-process: keep one instance
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true         # random secret generated by Render
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL           # Neon *direct* connection string (not the "-pooler" host)
        sync: false
      - key: CORS_ORIGINS           # your Vercel URL, e.g. https://careerpilot.vercel.app
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-flash-lite-latest
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: LLM_TIMEOUT_SECONDS
        value: "25"                 # stays under the proxy's request timeout
      - key: JOB_PROVIDERS
        value: greenhouse,lever
      - key: GREENHOUSE_BOARDS
        value: coinbase,okta,databricks,gitlab,twilio,mongodb,stripe,druva,rubrik,inmobi,razorpaysoftwareprivatelimited,groww
      - key: LEVER_COMPANIES
        value: paytm,meesho,zeta,cred
      - key: DEMO_MODE
        value: "false"
      - key: CODE_SANDBOX
        value: disabled
      - key: STORAGE_DIR
        value: /app/var/uploads
    # Uploaded resume files live on local disk. On the free plan the disk is reset on each deploy;
    # extracted resume text is kept in the database, so analysis still works. For durable files,
    # switch to plan: starter and uncomment:
    # disk:
    #   name: uploads
    #   mountPath: /app/var/uploads
    #   sizeGB: 1
